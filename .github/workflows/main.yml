name: pipeline CI/CD
run-name: Pipeline CI/CD executada por ${{ github.actor }} em ${{ github.run_number }}

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: obtendo o código do projeto
        uses: actions/checkout@v4
      - name: Analise do Dockerfile
        uses: hadolint/hadolint-action@v3.10
        with:
          dockerfile: ./src/Review-Filmes.Web/Dockerfile

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.300"
      - name: Execução do comando build
        working-directory: ./src
        run: dotnet build Review-Filmes.sln
  testes:
    needs: [build]
    uses: Lucas-19sc/desafio-cicd-01/.github/workflows/teste.yml@main



  release:
    name: Criação de release
    runs-on: ubuntu-latest
    needs: [testes]
    steps:
      - name: obtendo o código do projeto
        uses: actions/checkout@v4
      - name: logging in docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker Image Build and Push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: ./src
          file: ./src/Review-Filmes.Web/Dockerfile
          tags: lucascardoso1/devops-project-pro:v${{ github.run_number }}
      - name: Executar o trivy 
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: tags: lucascardoso1/devops-project-pro:v${{ github.run_number }}
          format: sarif
          output: trivy-docker-result.sarif
          severety: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
        
       - name: upload do arquivo trivy para o github
         uses: github/codeql-action/upload-sarif@v3
         with:
            category: docker-result
            sarif_file: trivy-docker-result.sarif



